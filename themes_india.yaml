# India sector universe. Same engine as themes.yaml; run with:
#   python -m themescan --themes themes_india.yaml scan
# Benchmark is the Nifty 50 (same currency, so relative strength is clean).
# "etfs" holds NSE sector indices / sector ETFs; "stocks" holds large liquid constituents.
# Any ticker Yahoo doesn't recognise is reported as missing and skipped.
benchmark: ^NSEI
events: []

themes:
  private_banks:
    label: Private banks
    etfs: [^NSEBANK, BANKBEES.NS]
    stocks: [HDFCBANK.NS, ICICIBANK.NS, AXISBANK.NS, KOTAKBANK.NS, INDUSINDBK.NS]
